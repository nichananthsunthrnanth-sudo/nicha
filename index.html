<!DOCTYPE html>
<html lang="th">
<head><meta charset="UTF-8"><title>แนะนำตัว</title></head>
<body style="text-align:center;background:lightblue;">
<h1>สวัสดีค่ะ</h1>
<h2>ณิชานันท์ สุทรนันท</h2>
<p>แผนกเทคโนโลยีสารสนเทศ</p>
<p>ยินดีต้อนรับสู่เว็บไซต์ของฉัน</p>
<button onclick="hello()">ทักทาย</button>
<p id="demo"></p>
<script>function hello(){document.getElementById('demo').innerHTML='ยินดีที่ได้รู้จักค่ะ';}</script>
</body>
</html>
